name: Desktop checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: desktop/go.sum
      - run: npm ci
      - run: npm run build:web
      - run: node --test tests/*.test.mjs
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run github.com/tc-hib/go-winres@v0.3.3 make --arch amd64
      - name: Cross-build Windows, Linux and macOS
        run: |
          for target in windows/amd64 linux/amd64 darwin/arm64 darwin/amd64; do
            flags='-s -w -X github.com/egoist/mygo.production=1'
            if [ "${target%/*}" = windows ]; then flags="$flags -H windowsgui"; fi
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -tags mygo_noinspector -buildvcs=false -trimpath -ldflags="$flags" -o "out/${target//\//-}/Scriptloom" .
          done
